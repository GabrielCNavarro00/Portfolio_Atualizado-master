<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form method="post" action="/loginCarro">
            <input type="text" name="login" placeholder="Login">
            <input type="password" name="senha" placeholder="Senha">
            <input type="submit" value="Entrar">
        </form>
        <br>
        <form method="get" action="/cadastrarcarro">
            <input type="submit" value="Cadastrar">
        </form>
    </div>
</body>
</html>
